name: ci

on:
  push:
    branches: [main, master]
    paths-ignore:
      - docs/**
      - intent/**
      - plans/**
      - specs/**
      - CHANGELOG.md
      - README.md
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: doctor (informational)
        shell: bash
        run: node bin/aidlc.js doctor --json || true

  # The loop benchmark (docs/OPERATIONS.md, Loop benchmark): deterministic counts of each hook event and the CLI start
  # against bench/baseline.json, apart from `check` so no local step waits on it. The build comes first, so the
  # compiled entry runs as it does for a user.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bench -- --check
