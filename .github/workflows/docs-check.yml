name: docs

# Light checks for docs-only pushes to main: the card registry still validates and the documentation
# statements the tests assert still hold. The test matrix (ci.yml, aidlc-ci.yml) ignores these paths on
# push; pull requests keep every check.
on:
  push:
    branches: [main, master]
    paths:
      - docs/**
      - intent/**
      - plans/**
      - specs/**
      - CHANGELOG.md
      - README.md

permissions:
  contents: read

jobs:
  docs:
    name: docs (light)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Task cards validate
        run: npx aidlc cards validate
      - name: Documentation statements and prose rules the tests assert
        run: node --test tests/surface/templates.test.ts tests/surface/prose.test.ts tests/scenarios/t1-plan.test.ts
