name: aidlc CI
on:
  pull_request:
  push:
    branches: [main, master]
    paths-ignore:
      - docs/**
      - intent/**
      - plans/**
      - specs/**
      - CHANGELOG.md
      - README.md

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test
      - name: Validate task cards
        run: npx aidlc cards validate
      - name: Audit trail (informational)
        continue-on-error: true
        run: npx aidlc audit verify --all
