name: Agent evals
on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'evals/**'
      - 'REVIEW.md'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # The deterministic checks only, so the job needs no model and no credentials.
      # Run the model-backed suite locally on the Claude Code CLI login (see evals/README.md).
      - name: Run eval checks
        run: npx aidlc evals run --skip-model --threshold 0.9 --json > evals-result.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evals
          path: evals-result.json
