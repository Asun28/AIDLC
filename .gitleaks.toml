# Gitleaks configuration for the committed-history scan (.github/workflows/security-scanners.yml).
# Extends the default rules; only the secrets-guard hook fixtures are allowlisted: the values there
# are placeholders the hook must deny (tests/surface/hooks.test.ts), not credentials.
[extend]
useDefault = true

[allowlist]
description = "Placeholder credentials used as fixtures by the secrets-guard hook tests"
paths = ['''tests/surface/hooks\.test\.ts''']
